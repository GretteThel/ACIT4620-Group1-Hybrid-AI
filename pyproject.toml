[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ham10000-hybrid"
version = "0.1.0"
description = "Reproducible data-centric HAM10000 seven-class Hybrid AI research project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
eda = ["matplotlib>=3.7", "seaborn>=0.13", "Pillow>=10", "scipy>=1.11", "tqdm>=4.66", "IPython>=8"]
model = ["torch>=2.2", "torchvision>=0.17"]
fuzzy = ["scikit-fuzzy>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Preserve the user-supplied executed reference notebook byte-for-byte.
extend-exclude = ["src/ham10000_hybrid/ham10000-eda-7class.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
